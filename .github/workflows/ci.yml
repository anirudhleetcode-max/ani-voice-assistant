name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The three jobs are deliberately independent. The language engine and the backend need
# no Android SDK at all, so they report in under a minute and keep reporting even if the
# Android toolchain is broken or unavailable.
jobs:
  language-engine:
    name: Language engine (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: core-nlu
        run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-nlu-test-report
          path: core-nlu/build/reports/tests/test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: backend
        run: pytest

  compile-check:
    name: Android sources type-check (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Compiles every Android source file against the real Android 35 framework and the
      # real Compose API, and runs the app's unit tests. Needs no Android SDK, so it keeps
      # reporting even when the SDK job cannot run.
      - name: Compile and test
        working-directory: tools/compile-check
        run: gradle test --no-daemon

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # packages: '' is load-bearing. The action's default is to run
      # `sdkmanager tools`, and Google removed the legacy `tools` package from the SDK
      # repository — so the step fails with "Failed to find package 'tools'" before the
      # build is even attempted. The runner image already ships the platform and
      # build-tools this project needs; AGP fetches anything else itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            app/build/reports
